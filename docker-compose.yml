# Runtime only. Build every image with ./build_docker.sh (docker buildx bake), which
# builds the flavours in parallel from one Dockerfile. Compose no longer builds anything.
services:
  base:
    image: "${PREFIX}-base:${TAG}"
    ports:
      - "8888:8888"
  neo4j:
    image: "${PREFIX}-neo4j:${TAG}"
    ports:
      - "7473:7473"
      - "7474:7474"
      - "7687:7687"
  pytorch:
    image: "${PREFIX}-pytorch:${TAG}"
  quantum:
    image: "${PREFIX}-quantum:${TAG}"
  geo:
    image: "${PREFIX}-geo:${TAG}"
