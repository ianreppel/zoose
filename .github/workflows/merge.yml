name: Master CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint the Dockerfile
        run: ./check_docker.sh
      - name: Build all images
        run: ./build_docker.sh
      - name: Record image sizes
        run: docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
      - name: Check the notebook token gate
        run: ./.github/check-jupyter-token.sh
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Smoke every image, then push verified images
        run: ./push_docker.sh
