name: PR CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Dockerfile
        run: ./check_docker.sh
      - name: Build all images
        run: ./build_docker.sh
      - name: Smoke every image before publishing
        run: ./.github/smoke-images.sh
