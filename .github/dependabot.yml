# One grouped PR a month for the pinned actions. The docker ecosystem was removed: it
# watched base/Dockerfile, which no longer exists, and its only allowed update (ubuntu)
# was also in `ignore`, so it could never open anything. The base image bump is a
# deliberate change, not a bot PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
